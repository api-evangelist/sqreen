name: Sqreen
description: 'Sqreen was a Paris- and San Francisco-based application security company
  offering Runtime Application Self-Protection (RASP), an in-app Web Application Firewall,
  and account-takeover and attack protection delivered through language agents for
  Node.js, Python, Ruby, PHP, Java and Go. Backed by Y Combinator, Greylock and Point
  Nine, Sqreen was acquired by Datadog in 2021 and its technology was folded into Datadog
  Application Security Management. The standalone sqreen.com product, dashboard and
  developer APIs have since been decommissioned; the domain no longer resolves. This
  profile is retained as a historical company lead and has no live, independent API
  surface to enrich.'
